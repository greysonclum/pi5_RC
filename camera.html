<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Camera 3 Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 1000px;
            width: 100%;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            aspect-ratio: 16/9;
        }

        #video-stream {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #1a1a1a;
        }

        .video-container.loading #video-stream {
            opacity: 0.5;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .video-container.loading .loading-spinner {
            display: block;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 8px;
            font-size: 14px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }

        .status-indicator.offline {
            background: #f44336;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 2px solid #ddd;
        }

        .btn-secondary:hover {
            background: #e8e8e8;
            border-color: #999;
        }

        .info-section {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            line-height: 1.6;
            color: #555;
        }

        .info-section h3 {
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }

        .info-section ul {
            list-style-position: inside;
            margin-left: 10px;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 20px;
            }

            .status-bar {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }

            button {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 Pi Camera 3 Stream</h1>
            <p>Real-time video streaming from Raspberry Pi 5</p>
        </div>

        <div class="content">
            <div class="video-container" id="video-container">
                <img id="video-stream" src="/video_feed" alt="Camera stream">
                <div class="loading-spinner"></div>
            </div>

            <div class="status-bar">
                <div class="status-item">
                    <div class="status-indicator" id="status-indicator"></div>
                    <span id="status-text">Connecting...</span>
                </div>
                <div class="status-item">
                    <span id="timestamp"></span>
                </div>
            </div>

            <div class="controls">
                <button class="btn-primary" onclick="refreshStream()">🔄 Refresh Stream</button>
                <button class="btn-secondary" onclick="downloadFrame()">⬇️ Download Frame</button>
            </div>

            <div class="info-section">
                <h3>📡 Connection Info</h3>
                <ul>
                    <li><strong>Stream URL:</strong> <code id="stream-url"></code></li>
                    <li><strong>Resolution:</strong> 1280×720 @ 30fps</li>
                    <li><strong>Format:</strong> MJPEG (Motion JPEG)</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Update timestamp
        function updateTimestamp() {
            const now = new Date().toLocaleTimeString();
            document.getElementById('timestamp').textContent = now;
        }

        // Update stream URL display
        function updateStreamURL() {
            const protocol = window.location.protocol;
            const hostname = window.location.hostname;
            const port = window.location.port ? `:${window.location.port}` : '';
            const url = `${protocol}//${hostname}${port}/video_feed`;
            document.getElementById('stream-url').textContent = url;
        }

        // Monitor stream status
        function monitorStream() {
            const img = document.getElementById('video-stream');
            const indicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');
            const container = document.getElementById('video-container');

            img.onload = function() {
                container.classList.remove('loading');
                indicator.classList.remove('offline');
                statusText.textContent = '🟢 Stream Active';
            };

            img.onerror = function() {
                container.classList.add('loading');
                indicator.classList.add('offline');
                statusText.textContent = '🔴 Stream Offline';
                // Retry in 3 seconds
                setTimeout(() => {
                    img.src = '/video_feed?' + new Date().getTime();
                }, 3000);
            };

            // Trigger initial load
            img.src = '/video_feed?' + new Date().getTime();
        }

        // Refresh stream
        function refreshStream() {
            const img = document.getElementById('video-stream');
            img.src = '/video_feed?' + new Date().getTime();
        }

        // Download current frame
        function downloadFrame() {
            const img = document.getElementById('video-stream');
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            const link = document.createElement('a');
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.download = `pi_camera_${new Date().getTime()}.jpg`;
            link.click();
        }

        // Initialize
        window.addEventListener('load', function() {
            updateStreamURL();
            updateTimestamp();
            monitorStream();
            setInterval(updateTimestamp, 1000);
        });
    </script>
</body>
</html>
